# Phase 0 of .github/Server_Design_Implementation_Plan.md.
#
# redis/nats/postgres are UNUSED by the application today — server/main.py
# still runs as a single process against SQLite. They're started here so
# every developer's local environment already has them running before any
# code depends on them (Phase 1 = Redis, Phase 2 = NATS, Phase 4 = Postgres),
# removing "works on my machine, no Redis installed" as a failure mode later.
#
# Start with: docker compose up -d
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # host 6380: another local project already owns 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]  # JetStream + monitoring, JetStream needed by Phase 4's write-behind queue
    ports:
      - "4222:4222"
      - "8222:8222"  # monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
